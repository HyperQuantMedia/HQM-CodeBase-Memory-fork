# Weekly soak test: 4h sustained load + ASan leak detection
#
# HQM fork: the weekly cron is REMOVED. A 4-hour soak every Sunday is the
# single largest consumer in a shared ~3000 min/month Actions budget, and this
# fork validates locally (scripts/build.sh + the test suite) rather than on
# hosted runners. The soak is still available on demand via workflow_dispatch,
# so nothing is lost — it just never fires on its own.
name: Nightly Soak

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Soak duration in minutes (default: 240 = 4h)'
        type: number
        default: 240

permissions:
  contents: read

jobs:
  soak:
    uses: ./.github/workflows/_soak.yml
    with:
      duration_minutes: ${{ inputs.duration_minutes || 240 }}
      run_asan: true
